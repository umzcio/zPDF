[project]
name = "zpdf-export"
version = "0.1.0"
description = "Local, offline PDF reconstruction helper and CLI for zPDF (DOCX, XLSX, HTML, Markdown, PPTX)."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "pypdfium2==5.13.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "pillow==12.3.0",
  "python-pptx==1.0.2",     # MIT; brings XlsxWriter 3.2.9 (BSD-2-Clause)
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "reportlab==4.4.3",
  "cmarkgfm==2024.11.20",   # verification only: GitHub's Markdown engine (MIT)
]

[project.scripts]
zpdf-export = "zpdf_export.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
zpdf_export = ["schemas/*.xsd"]
